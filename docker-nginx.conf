# nginx site for SUMMIT 2026 — included from /etc/nginx/http.d/.
# Document root is Laravel's public/ directory only.

server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12M;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Vite build output is content-hashed; uploads and brand assets are not.
    location ^~ /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        fastcgi_read_timeout 120;
        fastcgi_buffering off;

        internal;
    }

    # No other PHP file may be executed or downloaded.
    location ~ \.php$ {
        return 404;
    }

    # Hidden files, except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
