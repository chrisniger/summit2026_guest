# Local smoke test for the production image.
#
#   APP_KEY=base64:... docker compose up --build
#   open http://localhost:8080
#
# Compose also reads APP_KEY from this directory's .env, so if that file
# already has a key you can simply run `docker compose up --build`.
# This file is for local testing only — Coolify deploys the Dockerfile
# directly and does not use it.

name: summit2026-local

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: summit
      MYSQL_USER: summit
      MYSQL_PASSWORD: summit
      MYSQL_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # Host access for a GUI client; not needed by the app.
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      # Required: the entrypoint exits when this is empty.
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: summit
      DB_USERNAME: summit
      DB_PASSWORD: summit
      # http://localhost is not a secure origin, so relax the secure cookie.
      SESSION_SECURE_COOKIE: "false"
      MAIL_MAILER: log
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: ${RUN_SEEDERS:-false}
    volumes:
      # Uploads and framework caches survive image rebuilds.
      - app-storage:/var/www/html/storage

volumes:
  db-data:
  app-storage:
